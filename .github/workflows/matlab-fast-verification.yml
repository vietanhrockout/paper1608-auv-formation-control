name: MATLAB Fast Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verification:
    name: MATLAB fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2025b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true

      - name: Run 47 fast verification oracles
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            cd('paper1608');
            results = run_all_verifications(false);
            assert(sum(strcmp({results.status}, 'PASS')) == 47, 'CI expected exactly 47 passing fast oracles');
            assert(sum(strcmp({results.status}, 'FAIL')) == 0, 'CI found a failing oracle');
            assert(sum(strcmp({results.status}, 'SKIP')) == 14, 'CI expected exactly 14 explicitly deferred oracles (see run_all_verifications.m for per-test class and reason)');
